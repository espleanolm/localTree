<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Título — Linktree</title>
<style>
  :root {
    --bg: #f5f5f5;
    --surface: #ffffff;
    --surface-2: #f2f2f2;
    --text: #1a1a1a;
    --muted: #666666;
    --primary: #111111;
    --primary-dark: #000000;
    --primary-soft: rgba(0, 0, 0, 0.08);
    --accent: #888888;
    --border: rgba(0, 0, 0, 0.12);
    --radius: 20px;
    --btn-radius: 14px;
    --pattern-color: rgba(0, 0, 0, 0.07);
    --pattern-size: 26px;
    --pattern-opacity: 1;
    --branch-cols: 2;
  }
    * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    line-height: 1.45;
  }
  .pattern-layer { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: var(--pattern-opacity); }
  body[data-pattern="none"] .pattern-layer { background-image: none; }
  body[data-pattern="dots"] .pattern-layer { background-image: radial-gradient(var(--pattern-color) 2px, transparent 2px); background-size: var(--pattern-size) var(--pattern-size); }
  body[data-pattern="grid"] .pattern-layer { background-image: linear-gradient(to right, var(--pattern-color) 1px, transparent 1px), linear-gradient(to bottom, var(--pattern-color) 1px, transparent 1px); background-size: var(--pattern-size) var(--pattern-size); }
  body[data-pattern="diagonal"] .pattern-layer { background-image: repeating-linear-gradient(45deg, var(--pattern-color) 0, var(--pattern-color) 2px, transparent 2px, transparent var(--pattern-size)); }
  body[data-pattern="weave"] .pattern-layer { background-image: repeating-linear-gradient(0deg, var(--pattern-color) 0, var(--pattern-color) 1px, transparent 1px, transparent var(--pattern-size)), repeating-linear-gradient(90deg, var(--pattern-color) 0, var(--pattern-color) 1px, transparent 1px, transparent calc(var(--pattern-size) * 1.5)); }
  .app-shell { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 20px 16px 72px; }
  .top-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .status-pill { display: inline-flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 7px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #16a34a; }
  .admin-trigger { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .admin-trigger:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
  .profile-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: visible; box-shadow: 0 12px 32px rgba(0,0,0,0.06); }
  .banner-box { position: relative; height: 175px; border-top-left-radius: var(--radius); border-top-right-radius: var(--radius); overflow: hidden; background: linear-gradient(135deg, var(--primary), var(--accent)); }
  .banner-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .banner-scrim { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.08), rgba(0,0,0,0.34)); pointer-events: none; }
  .avatar-holder { position: relative; display: flex; justify-content: center; margin-top: -54px; z-index: 3; }
  .avatar-frame { width: 108px; height: 108px; border-radius: 50%; border: 4px solid var(--surface); background: var(--surface-2); box-shadow: 0 8px 20px rgba(0,0,0,0.14); overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .avatar-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .profile-body { padding: 12px 22px 24px; text-align: center; }
  .brand-title { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
  .brand-handle { margin-top: 2px; font-size: 13px; font-weight: 600; color: var(--primary); }
  .brand-bio { margin-top: 10px; font-size: 14px; color: var(--muted); max-width: 520px; margin-left: auto; margin-right: auto; }
  .links-list { margin-top: 20px; display: flex; flex-direction: column; gap: 11px; text-align: left; }
  .link-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-decoration: none; padding: 12px 14px; border-radius: var(--btn-radius); border: 1px solid var(--border); background: var(--surface-2); color: var(--text); }
  .link-item:hover { transform: translateY(-2px); border-color: var(--primary); }
  body[data-btn-style="solid"] .link-item { background: var(--primary); color: #fff; border-color: var(--primary); }
  body[data-btn-style="solid"] .link-item:hover { background: var(--primary-dark); }
  body[data-btn-style="outline"] .link-item { background: transparent; border: 1.5px solid var(--primary); }
  body[data-btn-style="outline"] .link-item:hover { background: var(--primary-soft); }
  .link-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .link-thumb { width: 42px; height: 42px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
  .link-symbol { width: 34px; height: 34px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--primary-soft); color: var(--primary); }
  body[data-btn-style="solid"] .link-symbol { background: rgba(255,255,255,0.2); color: #fff; }
  .link-text-wrap { min-width: 0; }
  .link-label { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .link-sub { font-size: 12px; opacity: .78; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .link-arrow { flex-shrink: 0; opacity: .8; }
  .branches-section { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); text-align: left; }
  .section-heading { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800; margin-bottom: 12px; }
  .section-heading svg { color: var(--primary); }
  .branches-grid { display: grid; grid-template-columns: repeat(var(--branch-cols), minmax(0,1fr)); gap: 12px; }
  @media (max-width: 560px) { .branches-grid { grid-template-columns: 1fr; } }
  .branch-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: calc(var(--btn-radius) + 2px); overflow: hidden; display: flex; flex-direction: column; }
  .branch-photo { width: 100%; height: 112px; object-fit: cover; display: block; background: var(--primary-soft); }
  .branch-content { padding: 11px 12px 13px; display: flex; flex-direction: column; gap: 6px; }
  .branch-name { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800; }
  .branch-name svg { color: var(--primary); }
  .branch-line { display: flex; align-items: flex-start; gap: 6px; font-size: 12px; color: var(--muted); }
  .branch-line svg { color: var(--primary); margin-top: 2px; }
  .branch-map-btn { margin-top: 4px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; background: var(--primary); color: #fff; font-size: 12px; font-weight: 700; padding: 7px 10px; border-radius: 9px; }
  .branch-map-btn:hover { background: var(--primary-dark); }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.58); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal-backdrop.open { display: flex; }
  .modal-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 20px; box-shadow: 0 20px 44px rgba(0,0,0,0.25); }
  .modal-title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; margin-bottom: 12px; }
  .modal-title svg { color: var(--primary); }
  .field-input, .field-select, .field-textarea { width: 100%; padding: 9px 11px; border-radius: 10px; border: 1px solid rgba(0,0,0,0.2); background: #fff; color: #1a1a1a; font-size: 13px; font-family: inherit; }
  .field-textarea { min-height: 64px; resize: vertical; }
  .field-input:focus, .field-select:focus, .field-textarea:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
  .error-msg { margin-top: 8px; font-size: 12px; font-weight: 700; color: #b91c1c; min-height: 16px; }
  .modal-actions { margin-top: 14px; display: flex; justify-content: flex-end; gap: 8px; }
  .btn-secondary, .btn-primary, .btn-danger, .btn-small { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; padding: 9px 13px; font-family: inherit; }
  .btn-secondary { background: #eee; color: #1a1a1a; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-danger { background: #fee2e2; color: #b91c1c; }
  .btn-small { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
  .editor-panel { display: none; margin-top: 18px; background: var(--surface); border: 2px solid var(--primary); border-radius: var(--radius); padding: 18px; }
  .editor-panel.active { display: block; }
  .editor-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .editor-title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; }
  .editor-title svg { color: var(--primary); }
  .editor-block { margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px solid rgba(0,0,0,0.08); }
  .editor-block:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .block-label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; margin-bottom: 10px; }
  .block-label svg { color: var(--primary); }
  .form-grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
  @media (max-width: 540px) { .form-grid-2 { grid-template-columns: 1fr; } }
  .field-group { display: flex; flex-direction: column; gap: 4px; }
  .field-caption { font-size: 11px; font-weight: 700; color: #666; }
  .item-editor-card { background: #f7f7f7; border: 1px solid var(--border); border-radius: 12px; padding: 11px; margin-bottom: 10px; }
  .item-editor-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 12px; font-weight: 800; }
  .config-file-box { background: #1a1a1a; color: #fff; border-radius: 12px; padding: 12px; margin-top: 10px; }
  .config-file-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; font-size: 12px; font-weight: 700; }
  .config-code-area { width: 100%; min-height: 150px; background: #111; color: #ddd; border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; padding: 10px; font-family: ui-monospace, monospace; font-size: 11.5px; line-height: 1.4; resize: vertical; }
  .toast-msg { margin-top: 8px; font-size: 12px; font-weight: 700; color: #15803d; min-height: 16px; }
</style>
</head>
<body data-pattern="dots" data-btn-style="soft">
  <div class="pattern-layer" aria-hidden="true"></div>
  <svg width="0" height="0" style="position:absolute;visibility:hidden;" aria-hidden="true">
    <defs>
      <symbol id="sym-store" viewBox="0 0 24 24"><path d="M4 4h16l1.5 5.5a3.2 3.2 0 0 1-3.1 4h-.4V20h-3v-5H9v5H6v-6.5h-.4a3.2 3.2 0 0 1-3.1-4L4 4Z" /></symbol>
      <symbol id="sym-bag" viewBox="0 0 24 24"><path d="M6 7h2V6a4 4 0 0 1 8 0v1h2l1 14H5L6 7Zm4 0h4V6a2 2 0 0 0-4 0v1Z" /></symbol>
      <symbol id="sym-tag" viewBox="0 0 24 24"><path d="M12.5 3H21v8.5L11 21.5 2.5 13 12.5 3Zm4.5 3a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z" /></symbol>
      <symbol id="sym-heart" viewBox="0 0 24 24"><path d="M12 20.5 3.5 12a5 5 0 0 1 7.1-7L12 6.4l1.4-1.4a5 5 0 0 1 7.1 7L12 20.5Z" /></symbol>
      <symbol id="sym-pin" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z" /></symbol>
      <symbol id="sym-clock" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm1 10.6 4.2 2.5-1 1.7L11 13.7V7h2v5.6Z" /></symbol>
      <symbol id="sym-chat" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-7.9 13.3L3 21l4.9-1.1A9 9 0 1 0 12 3Z" /></symbol>

      <symbol id="sym-lock" viewBox="0 0 24 24"><path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2Zm-7-2a2 2 0 0 1 4 0v2h-4V7Z" /></symbol>
      <symbol id="sym-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18h1.5a2 2 0 0 0 0-4H12a2 2 0 0 1-2-2c0-1.1.9-2 2-2h4a5 5 0 0 0 0-10h-4Zm-3.5 6A1.5 1.5 0 1 1 7 7.5 1.5 1.5 0 0 1 8.5 9Zm4-2A1.5 1.5 0 1 1 11 5.5 1.5 1.5 0 0 1 12.5 7Zm4 2A1.5 1.5 0 1 1 15 7.5 1.5 1.5 0 0 1 16.5 9Z" /></symbol>
      <symbol id="sym-link" viewBox="0 0 24 24"><path d="M10.6 13.4a1 1 0 0 1 0-1.4l2.8-2.8a1 1 0 0 1 1.4 1.4L12 13.4a1 1 0 0 1-1.4 0Zm-2.1 5.1a4 4 0 0 1 0-5.7l2.1-2.1 1.4 1.4-2.1 2.1a2 2 0 0 0 2.8 2.8l2.1-2.1 1.4 1.4-2.1 2.1a4 4 0 0 1-5.6.1Zm4.9-11.3 2.1-2.1a4 4 0 0 1 5.7 5.7l-2.1 2.1-1.4-1.4 2.1-2.1a2 2 0 0 0-2.8-2.8l-2.1 2.1-1.4-1.4Z" /></symbol>

  </svg>

  <div class="app-shell">
    <header class="top-bar">
      <div class="status-pill"><span class="status-dot"></span><span id="cfg-source-text">config.json</span></div>
      <button type="button" class="admin-trigger" id="btn-open-auth"><svg width="15" height="15" fill="currentColor"><use href="#sym-lock"></use></svg><span>Editar</span></button>
    </header>

    <main class="profile-card">
      <div class="banner-box"><img id="view-banner" alt="Banner" /><div class="banner-scrim"></div></div>
      <div class="avatar-holder"><div class="avatar-frame"><img id="view-avatar" alt="Perfil" /></div></div>
      <div class="profile-body">
        <h1 class="brand-title" id="view-title"></h1>
        <p class="brand-handle" id="view-handle"></p>
        <p class="brand-bio" id="view-bio"></p>
        <nav class="links-list" id="view-links"></nav>
        <section class="branches-section" id="branches-section">
          <h2 class="section-heading"><svg width="17" height="17" fill="currentColor"><use href="#sym-pin"></use></svg><span id="view-branches-title"></span></h2>
          <div class="branches-grid" id="view-branches"></div>
        </section>
      </div>
    </main>

    <section class="editor-panel" id="editor-panel">
      <div class="editor-header">
        <div class="editor-title"><svg width="18" height="18" fill="currentColor"><use href="#sym-palette"></use></svg><span>Panel de Configuración</span></div>
        <button type="button" class="btn-secondary btn-small" id="btn-lock-panel"><svg width="14" height="14" fill="currentColor"><use href="#sym-lock"></use></svg><span>Bloquear</span></button>
      </div>

      <div class="editor-block">
        <div class="block-label"><svg width="15" height="15" fill="currentColor"><use href="#sym-store"></use></svg> Perfil</div>
        <div class="form-grid-2">
          <div class="field-group"><span class="field-caption">Título</span><input class="field-input" id="edit-title" /></div>
          <div class="field-group"><span class="field-caption">Subtítulo</span><input class="field-input" id="edit-handle" /></div>
          <div class="field-group" style="grid-column:1/-1"><span class="field-caption">Mensaje</span><textarea class="field-textarea" id="edit-bio"></textarea></div>
          <div class="field-group"><span class="field-caption">URL Banner</span><input class="field-input" id="edit-banner" /></div>
          <div class="field-group"><span class="field-caption">URL Avatar</span><input class="field-input" id="edit-avatar" /></div>
        </div>
      </div>

      <div class="editor-block">
        <div class="block-label"><svg width="15" height="15" fill="currentColor"><use href="#sym-link"></use></svg> Botones / Enlaces</div>
        <div id="links-editor"></div>
        <button type="button" class="btn-secondary btn-small" id="btn-add-link"><svg width="13" height="13" fill="currentColor"><use href="#sym-plus"></use></svg> Añadir botón</button>
      </div>

      <div class="editor-block">
        <div class="block-label"><svg width="15" height="15" fill="currentColor"><use href="#sym-pin"></use></svg> Sucursales</div>
        <div class="field-group" style="margin-bottom:10px"><span class="field-caption">Título de sección</span><input class="field-input" id="edit-branches-title" /></div>
        <div id="branches-editor"></div>
        <button type="button" class="btn-secondary btn-small" id="btn-add-branch"><svg width="13" height="13" fill="currentColor"><use href="#sym-plus"></use></svg> Añadir sucursal</button>
      </div>

      <div class="editor-block">
        <div class="block-label"><svg width="15" height="15" fill="currentColor"><use href="#sym-palette"></use></svg> Diseño</div>
        <div class="form-grid-2">
          <div class="field-group"><span class="field-caption">Color principal</span><input type="color" class="field-input" id="edit-primary" /></div>
          <div class="field-group"><span class="field-caption">Color fondo</span><input type="color" class="field-input" id="edit-bg" /></div>
          <div class="field-group"><span class="field-caption">Patrón</span><select class="field-select" id="edit-pattern"><option value="none">Ninguno</option><option value="dots">Puntos</option><option value="grid">Cuadrícula</option><option value="diagonal">Diagonal</option><option value="weave">Tejido</option></select></div>
          <div class="field-group"><span class="field-caption">Estilo botones</span><select class="field-select" id="edit-btn-style"><option value="soft">Suave</option><option value="solid">Sólido</option><option value="outline">Borde</option></select></div>
        </div>
      </div>

      <div class="editor-block">
        <div class="modal-actions" style="justify-content:flex-start">
          <button type="button" class="btn-primary" id="btn-save">Guardar cambios</button>
          <button type="button" class="btn-danger" id="btn-reset">Restablecer valores por defecto</button>
        </div>
        <div class="toast-msg" id="toast"></div>
        <div class="config-file-box">
          <div class="config-file-top"><span>config.json</span><button type="button" class="btn-secondary btn-small" id="btn-copy-config">Copiar</button></div>
          <textarea class="config-code-area" id="config-code" readonly></textarea>
        </div>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" id="auth-modal">
    <div class="modal-card">
      <div class="modal-title"><svg width="18" height="18" fill="currentColor"><use href="#sym-lock"></use></svg> Ingresar contraseña</div>
      <input type="password" class="field-input" id="auth-pass" placeholder="Contraseña" />
      <div class="error-msg" id="auth-error"></div>
      <div class="modal-actions"><button type="button" class="btn-secondary" id="btn-cancel-auth">Cancelar</button><button type="button" class="btn-primary" id="btn-confirm-auth">Entrar</button></div>
    </div>
  </div>

<script>
const DEFAULT_CONFIG = {
  title: "Título",
  handle: "Subtítulo",
  bio: "Mensaje",
  banner: "https://picsum.photos/680/175",
  avatar: "https://picsum.photos/200/200",
  branchesTitle: "Sucursales",
  links: [
    { label: "Título botón 1", sub: "Subtítulo botón 1", url: "https://ejemplo.com/1", icon: "bag", image: "" },
    { label: "Título botón 2", sub: "Subtítulo botón 2", url: "https://ejemplo.com/2", icon: "tag", image: "" },
    { label: "Título botón 3", sub: "Subtítulo botón 3", url: "https://ejemplo.com/3", icon: "chat", image: "" }
  ],
  branches: [
    { name: "Sucursal 1", address: "Dirección 1", hours: "Horario 1", mapUrl: "https://maps.google.com", photo: "https://picsum.photos/400/200" },
    { name: "Sucursal 2", address: "Dirección 2", hours: "Horario 2", mapUrl: "https://maps.google.com", photo: "https://picsum.photos/400/201" }
  ],
  theme: { primary: "#111111", bg: "#f5f5f5", pattern: "dots", btnStyle: "soft" }
};
const PASSWORD = "CAMBIAR_CONTRASEÑA_AQUI";
let config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
try { const saved = localStorage.getItem("linktree-config"); if (saved) config = { ...JSON.parse(JSON.stringify(DEFAULT_CONFIG)), ...JSON.parse(saved) }; } catch(e){}

const $ = id => document.getElementById(id);
const icons = ["store","bag","tag","heart","pin","clock","chat","camera","palette","link"];

function applyTheme(){
  const r = document.documentElement.style;
  r.setProperty("--primary", config.theme.primary);
  r.setProperty("--bg", config.theme.bg);
  document.body.dataset.pattern = config.theme.pattern;
  document.body.dataset.btnStyle = config.theme.btnStyle;
}
function render(){
  applyTheme();
  $("view-title").textContent = config.title;
  $("view-handle").textContent = config.handle;
  $("view-bio").textContent = config.bio;
  $("view-banner").src = config.banner;
  $("view-avatar").src = config.avatar;
  $("view-branches-title").textContent = config.branchesTitle;
  document.title = config.title + " — Linktree";
  const linksEl = $("view-links"); linksEl.innerHTML = "";
  config.links.forEach(l => {
    const a = document.createElement("a"); a.className = "link-item"; a.href = l.url; a.target = "_blank"; a.rel = "noopener";
    a.innerHTML = `<span class="link-left"><span class="link-symbol"><svg width="18" height="18" fill="currentColor"><use href="#sym-${l.icon || "link"}"></use></svg></span><span class="link-text-wrap"><span class="link-label">${l.label}</span><br><span class="link-sub">${l.sub || ""}</span></span></span><span class="link-arrow"><svg width="18" height="18" fill="currentColor"><use href="#sym-arrow"></use></svg></span>`;
    linksEl.appendChild(a);
  });
  const brEl = $("view-branches"); brEl.innerHTML = "";
  config.branches.forEach(b => {
    const d = document.createElement("div"); d.className = "branch-card";
    d.innerHTML = `<img class="branch-photo" src="${b.photo}" alt=""><div class="branch-content"><div class="branch-name"><svg width="14" height="14" fill="currentColor"><use href="#sym-pin"></use></svg>${b.name}</div><div class="branch-line"><svg width="13" height="13" fill="currentColor"><use href="#sym-pin"></use></svg>${b.address}</div><div class="branch-line"><svg width="13" height="13" fill="currentColor"><use href="#sym-clock"></use></svg>${b.hours}</div><a class="branch-map-btn" href="${b.mapUrl}" target="_blank">Ver en mapa</a></div>`;
    brEl.appendChild(d);
  });
  $("config-code").value = JSON.stringify(config, null, 2);
}
function renderEditor(){
  $("edit-title").value = config.title;
  $("edit-handle").value = config.handle;
  $("edit-bio").value = config.bio;
  $("edit-banner").value = config.banner;
  $("edit-avatar").value = config.avatar;
  $("edit-branches-title").value = config.branchesTitle;
  $("edit-primary").value = config.theme.primary;
  $("edit-bg").value = config.theme.bg;
  $("edit-pattern").value = config.theme.pattern;
  $("edit-btn-style").value = config.theme.btnStyle;
  const le = $("links-editor"); le.innerHTML = "";
  config.links.forEach((l,i)=>{
    const d=document.createElement("div"); d.className="item-editor-card";
    d.innerHTML=`<div class="item-editor-top"><span>Botón ${i+1}</span><button type="button" class="btn-danger btn-small" data-del-link="${i}">Eliminar</button></div>
    <div class="form-grid-2">
      <div class="field-group"><span class="field-caption">Título botón</span><input class="field-input" data-link="label" data-i="${i}" value="${l.label}"></div>
      <div class="field-group"><span class="field-caption">Subtítulo botón</span><input class="field-input" data-link="sub" data-i="${i}" value="${l.sub||""}"></div>
      <div class="field-group"><span class="field-caption">Enlace</span><input class="field-input" data-link="url" data-i="${i}" value="${l.url}"></div>
      <div class="field-group"><span class="field-caption">Icono</span><select class="field-select" data-link="icon" data-i="${i}">${icons.map(ic=>`<option value="${ic}" ${ic===l.icon?"selected":""}>${ic}</option>`).join("")}</select></div>
    </div>`;
    le.appendChild(d);
  });
  const be=$("branches-editor"); be.innerHTML="";
  config.branches.forEach((b,i)=>{
    const d=document.createElement("div"); d.className="item-editor-card";
    d.innerHTML=`<div class="item-editor-top"><span>Sucursal ${i+1}</span><button type="button" class="btn-danger btn-small" data-del-branch="${i}">Eliminar</button></div>
    <div class="form-grid-2">
      <div class="field-group"><span class="field-caption">Nombre</span><input class="field-input" data-branch="name" data-i="${i}" value="${b.name}"></div>
      <div class="field-group"><span class="field-caption">Dirección</span><input class="field-input" data-branch="address" data-i="${i}" value="${b.address}"></div>
      <div class="field-group"><span class="field-caption">Horario</span><input class="field-input" data-branch="hours" data-i="${i}" value="${b.hours}"></div>
      <div class="field-group"><span class="field-caption">Link mapa</span><input class="field-input" data-branch="mapUrl" data-i="${i}" value="${b.mapUrl}"></div>
      <div class="field-group" style="grid-column:1/-1"><span class="field-caption">Foto</span><input class="field-input" data-branch="photo" data-i="${i}" value="${b.photo}"></div>
    </div>`;
    be.appendChild(d);
  });
}
document.addEventListener("input", e=>{
  const t=e.target;
  if(t.dataset.link) config.links[+t.dataset.i][t.dataset.link]=t.value;
  if(t.dataset.branch) config.branches[+t.dataset.i][t.dataset.branch]=t.value;
});
document.addEventListener("click", e=>{
  const dl=e.target.closest("[data-del-link]"); if(dl){ config.links.splice(+dl.dataset.delLink,1); renderEditor(); return; }
  const db=e.target.closest("[data-del-branch]"); if(db){ config.branches.splice(+db.dataset.delBranch,1); renderEditor(); return; }
});
$("btn-open-auth").onclick=()=>{ $("auth-modal").classList.add("open"); $("auth-error").textContent=""; $("auth-pass").value=""; $("auth-pass").focus(); };
$("btn-cancel-auth").onclick=()=> $("auth-modal").classList.remove("open");
$("btn-confirm-auth").onclick=()=>{
  if($("auth-pass").value===PASSWORD){ $("auth-modal").classList.remove("open"); $("editor-panel").classList.add("active"); renderEditor(); }
  else $("auth-error").textContent="Contraseña incorrecta";
};
$("btn-lock-panel").onclick=()=> $("editor-panel").classList.remove("active");
$("btn-add-link").onclick=()=>{ config.links.push({label:"Título botón", sub:"Subtítulo botón", url:"https://ejemplo.com", icon:"link", image:""}); renderEditor(); };
$("btn-add-branch").onclick=()=>{ config.branches.push({name:"Sucursal", address:"Dirección", hours:"Horario", mapUrl:"https://maps.google.com", photo:"https://picsum.photos/400/200"}); renderEditor(); };
$("btn-save").onclick=()=>{
  config.title=$("edit-title").value; config.handle=$("edit-handle").value; config.bio=$("edit-bio").value;
  config.banner=$("edit-banner").value; config.avatar=$("edit-avatar").value; config.branchesTitle=$("edit-branches-title").value;
  config.theme.primary=$("edit-primary").value; config.theme.bg=$("edit-bg").value; config.theme.pattern=$("edit-pattern").value; config.theme.btnStyle=$("edit-btn-style").value;
  localStorage.setItem("linktree-config", JSON.stringify(config));
  render(); $("toast").textContent="Guardado correctamente ✓";
};
$("btn-reset").onclick=()=>{ if(confirm("¿Restablecer valores por defecto?")){ config=JSON.parse(JSON.stringify(DEFAULT_CONFIG)); localStorage.removeItem("linktree-config"); render(); renderEditor(); } };
$("btn-copy-config").onclick=()=>{ navigator.clipboard.writeText($("config-code").value); $("toast").textContent="Config copiada ✓"; };
render();
</script>
</body>
</html>
